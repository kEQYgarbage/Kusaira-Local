<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Kusaira Desktop</title>
  <style>
    :root {
      --bg-base: #0D0F12; --bg-surface: #12151A; --bg-card: #1A1D24; --bg-elevated: #1F232B;
      --border-subtle: rgba(255, 255, 255, 0.08); --border-highlight: rgba(255, 255, 255, 0.16);
      --text-primary: #FFFFFF; --text-secondary: rgba(255, 255, 255, 0.65); --text-muted: rgba(255, 255, 255, 0.40);
      --accent-primary: #2AABEE; --accent-purple: #A855F7; --accent-green: #30D158; --accent-gold: #FFD60A;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; overflow-x: hidden; user-select: none; -webkit-font-smoothing: antialiased; }
    
    /* Header */
    .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 36px; background: rgba(13, 15, 18, 0.92); backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border-subtle); }
    .header-left { display: flex; align-items: center; gap: 32px; }
    .header-brand { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 1.25rem; font-weight: 700; cursor: pointer; }
    .header-nav { display: flex; gap: 4px; }
    .nav-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; padding: 8px 16px; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
    .nav-btn:hover, .nav-btn.active { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .header-center { width: 340px; }
    .search-wrap { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); border: 0.5px solid var(--border-subtle); border-radius: 12px; padding: 8px 14px; transition: all 0.2s; }
    .search-wrap:focus-within { background: rgba(255, 255, 255, 0.09); border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(42, 171, 238, 0.18); }
    .search-input { background: transparent; border: none; outline: none; color: #fff; font-size: 0.88rem; width: 100%; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .status-pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); border: 0.5px solid var(--border-subtle); padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; color: var(--text-secondary); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); }

    .container { max-width: 1280px; margin: 0 auto; padding: 28px 36px; }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s var(--ease-out); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .btn-back { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: none; color: var(--text-secondary); font-size: 0.88rem; font-weight: 600; cursor: pointer; margin-bottom: 22px; transition: color 0.15s; }
    .btn-back:hover { color: #fff; }

    /* Hero Anime Card */
    .anime-hero { display: flex; gap: 36px; align-items: flex-start; margin-bottom: 32px; }
    .hero-poster-wrap { width: 220px; flex-shrink: 0; aspect-ratio: 3 / 4.2; border-radius: 18px; overflow: hidden; border: 0.5px solid var(--border-subtle); background: var(--bg-card); box-shadow: 0 20px 45px rgba(0,0,0,0.6); position: relative; }
    .hero-poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .poster-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(18, 21, 26, 0.85); backdrop-filter: blur(12px); padding: 4px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; color: #fff; border: 0.5px solid rgba(255,255,255,0.12); display: flex; align-items: center; gap: 6px; }
    .pts-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; color: var(--accent-primary); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.04em; }

    .hero-info { flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .anime-title { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2; }
    .anime-subtitle { font-size: 0.95rem; color: var(--text-secondary); }
    .anime-meta-line { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--text-secondary); font-weight: 500; }
    .meta-star { color: var(--accent-gold); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .genres-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
    .genre-tag { background: rgba(255, 255, 255, 0.05); border: 0.5px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.8rem; font-weight: 500; padding: 4px 12px; border-radius: 8px; }

    .hero-actions { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
    .btn-watch-primary { background: #FFFFFF; color: #000000; border: none; padding: 13px 28px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; }
    .btn-watch-primary:hover { background: #E5E5EA; transform: scale(1.02); }
    .btn-action-glass { background: rgba(255, 255, 255, 0.06); border: 0.5px solid var(--border-subtle); color: #fff; padding: 13px 20px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; }
    .btn-action-glass:hover { background: rgba(255, 255, 255, 0.12); }

    .release-selector-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; font-size: 0.84rem; color: var(--text-secondary); }
    .release-dropdown { background: rgba(255, 255, 255, 0.05); border: 0.5px solid var(--border-subtle); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; outline: none; cursor: pointer; }

    /* Episodes Section */
    .episodes-section { margin-top: 18px; }
    .episodes-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-title { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .vo-pills-wrap { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .vo-pill { background: rgba(255, 255, 255, 0.05); border: 0.5px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; padding: 8px 18px; border-radius: 100px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
    .vo-pill:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .vo-pill.active { background: #FFFFFF; border-color: #FFFFFF; color: #000000; font-weight: 700; }

    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
    .ep-btn { position: relative; background: rgba(255, 255, 255, 0.06); border: 0.5px solid var(--border-subtle); color: #fff; font-size: 0.95rem; font-weight: 700; padding: 15px 4px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.14s; }
    .ep-btn:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255,255,255,0.2); }
    .ep-btn.active { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
    .ep-indicator { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; }
    .ep-ready { background: var(--accent-green); }
    .ep-buffering { background: var(--accent-primary); }

    /* Video Overlay (libvlc frame) */
    .video-overlay { position: fixed; inset: 0; z-index: 1000; background: #000; display: none; flex-direction: column; }
    .video-overlay.open { display: flex; animation: fadeIn 0.18s var(--ease-out); }
    .video-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: linear-gradient(180deg, rgba(13,15,18,0.95) 0%, rgba(13,15,18,0) 100%); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
    .btn-close-player { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); transition: background 0.15s; }
    .btn-close-player:hover { background: rgba(255,255,255,0.22); }
    .player-title-row { display: flex; align-items: center; gap: 12px; }
    .player-anime-name { font-size: 1rem; font-weight: 700; color: #fff; }
    .player-ep-name { font-size: 0.9rem; color: var(--text-secondary); }
    .btn-next-episode { background: rgba(255,255,255,0.12); border: 0.5px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(12px); transition: all 0.15s; }
    .btn-next-episode:hover { background: rgba(255,255,255,0.24); }

    .video-viewport { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
    .video-bottombar { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 20px 28px; background: linear-gradient(0deg, rgba(13,15,18,0.95) 0%, rgba(13,15,18,0) 100%); display: flex; flex-direction: column; gap: 10px; }
    .video-timeline { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; position: relative; cursor: pointer; }
    .timeline-loaded { position: absolute; left: 0; top: 0; height: 100%; width: 72%; background: rgba(255,255,255,0.4); border-radius: 3px; }
    .timeline-played { position: absolute; left: 0; top: 0; height: 100%; width: 28%; background: var(--accent-primary); border-radius: 3px; }
    .video-controls-row { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-group { display: flex; align-items: center; gap: 16px; }
    .btn-ctrl { background: transparent; border: none; color: #fff; font-size: 1.15rem; cursor: pointer; }
    .track-dropdown { background: rgba(255,255,255,0.1); border: 0.5px solid var(--border-subtle); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; outline: none; cursor: pointer; }

    /* Catalog Cards */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; }
    .card { display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform 180ms var(--ease-out); }
    .card:hover { transform: translateY(-4px); }
    .card:hover .card-title { color: var(--accent-primary); }
    .card-poster { width: 100%; aspect-ratio: 3 / 4.2; border-radius: 16px; background: var(--bg-card); position: relative; overflow: hidden; border: 0.5px solid var(--border-subtle); }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Clean Kusaira Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-brand" onclick="navTo('catalog')">
        <svg width="26" height="26" viewBox="0 0 512 512" style="flex-shrink: 0">
          <path d="M104 190 L128 86 L211 135 C225 130 240 127 256 127 C272 127 287 130 301 135 L384 86 L408 190 C423 215 430 244 430 276 C430 369 355 425 256 425 C157 425 82 369 82 276 C82 244 89 215 104 190Z" fill="#11101A"/>
          <path d="M151 205 C166 160 204 143 256 143 C308 143 346 160 361 205 L350 302 C342 357 306 388 256 396 C206 388 170 357 162 302Z" fill="#17131F"/>
          <path d="M154 247 C177 221 213 219 239 244 C218 267 181 272 154 247Z" fill="#A855F7"/>
          <path d="M358 247 C335 221 299 219 273 244 C294 267 331 272 358 247Z" fill="#A855F7"/>
          <circle cx="187" cy="237" r="5" fill="#F5E9FF"/>
          <circle cx="307" cy="237" r="5" fill="#F5E9FF"/>
          <path d="M256 275 l-7 6 h14z" fill="#A855F7"/>
        </svg>
        <span>Kusaira</span>
      </div>

      <nav class="header-nav">
        <button class="nav-btn" id="nav-btn-cat" onclick="navTo('catalog')">Каталог</button>
        <button class="nav-btn active" id="nav-btn-det" onclick="navTo('detail')">Тайтл</button>
        <button class="nav-btn" onclick="alert('Локальные загрузки: ~/Videos/Anime')">Загрузки</button>
      </nav>
    </div>

    <div class="header-center">
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" class="search-input" id="search-input" placeholder="Поиск аниме..." value="Mushoku Tensei II" onkeydown="if(event.key==='Enter') executeSearch(this.value)">
      </div>
    </div>

    <div class="header-right">
      <div class="status-pill" title="Серия 2 предзагружается в фоне">
        <span class="status-dot"></span>
        <span id="header-buf-text">Буфер: 2 серия готова</span>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- VIEW 1: CATALOG -->
    <div class="view-section" id="view-catalog">
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 22px;">Популярные тайтлы</h2>
      <div class="catalog-grid" id="catalog-grid"></div>
    </div>

    <!-- VIEW 2: ANIME DETAIL (Authentic Kusaira Minimal) -->
    <div class="view-section active" id="view-detail">
      
      <button class="btn-back" onclick="navTo('catalog')">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"/></svg>
        <span>Назад в каталог</span>
      </button>

      <div class="anime-hero">
        <div class="hero-poster-wrap">
          <img id="detail-poster-img" src="" alt="Poster">
          <span class="poster-badge" id="hero-poster-badge">1080p • <span class="pts-badge" id="poster-pts">94 PTS</span></span>
        </div>

        <div class="hero-info">
          <h1 class="anime-title" id="detail-title">Загрузка...</h1>
          <div class="anime-subtitle" id="detail-subtitle"></div>

          <div class="anime-meta-line" id="detail-meta-line"></div>

          <div class="genres-wrap" id="detail-genres"></div>

          <div class="hero-actions">
            <button class="btn-watch-primary" onclick="openPlayer(1)">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <span id="btn-watch-text">Смотреть 1 серию</span>
            </button>
            <button class="btn-action-glass" onclick="alert('Добавлено в локальные загрузки')">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Скачать весь сезон</span>
            </button>
          </div>

          <!-- Discrete Release Selector -->
          <div class="release-selector-row">
            <span>Раздача:</span>
            <select class="release-dropdown" id="release-select" onchange="onReleaseChange(this.value)"></select>
          </div>
        </div>
      </div>

      <!-- Episodes Section -->
      <div class="episodes-section">
        <div class="episodes-bar">
          <div class="section-title">Серии</div>
          <span style="font-size: 0.85rem; color: var(--text-muted)" id="episodes-count-text">12 серий</span>
        </div>

        <!-- Voiceover Pills -->
        <div class="vo-pills-wrap" id="detail-vos"></div>

        <!-- Clean Episodes Grid -->
        <div class="ep-grid" id="episodes-grid"></div>
      </div>

    </div>

  </div>

  <!-- AUTHENTIC KUSAIRA VIDEO OVERLAY (libvlc) -->
  <div class="video-overlay" id="video-overlay">
    <div class="video-topbar">
      <div style="display: flex; align-items: center; gap: 14px;">
        <button class="btn-close-player" onclick="closePlayer()" title="Закрыть">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="player-title-row">
          <span class="player-anime-name" id="player-title">Аниме</span>
          <span style="color: rgba(255,255,255,0.3)">•</span>
          <span class="player-ep-name" id="player-ep-name">1 серия</span>
        </div>
      </div>

      <button class="btn-next-episode" onclick="playNextEpisode()">
        <span>Следующая серия</span>
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="video-viewport" id="vlc-viewport">
      <div style="text-align: center; color: rgba(255,255,255,0.7)">
        <div style="font-size: 3rem; margin-bottom: 8px;">▶</div>
        <div style="font-size: 0.95rem; font-weight: 600;">Встроенный плеер libvlc • Аппаратное ускорение VA-API</div>
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">10-bit HEVC • Без транскодинга • Стили субтитров ASS</div>
      </div>
    </div>

    <div class="video-bottombar">
      <div class="video-timeline">
        <div class="timeline-loaded"></div>
        <div class="timeline-played" id="timeline-played"></div>
      </div>
      <div class="video-controls-row">
        <div class="ctrl-group">
          <button class="btn-ctrl" onclick="togglePlayPause()">⏸</button>
          <button class="btn-ctrl" onclick="playNextEpisode()">⏭</button>
          <span style="font-size: 0.85rem; font-family: monospace; color: #fff;" id="time-display">08:14 / 24:10</span>
        </div>
        <div class="ctrl-group">
          <span style="font-size: 0.8rem; color: var(--text-muted)">Озвучка:</span>
          <select class="track-dropdown" id="audio-track-select" onchange="setAudioTrack(this.value)"></select>
          <button class="btn-ctrl" title="Полный экран">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentEpisode = 1;
    let currentAnime = null;

    function navTo(view) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (view === 'catalog') {
        document.getElementById('view-catalog').classList.add('active');
        document.getElementById('nav-btn-cat').classList.add('active');
      } else {
        document.getElementById('view-detail').classList.add('active');
        document.getElementById('nav-btn-det').classList.add('active');
      }
    }

    function setVo(btn) {
      document.querySelectorAll('.vo-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
    }

    async function loadCatalog() {
      try {
        const res = await fetch('/api/search?q=Mushoku');
        const data = await res.json();
        const grid = document.getElementById('catalog-grid');
        grid.innerHTML = data.results.map(a => `
          <div class="card" onclick="openAnimeDetails('${a.id}')">
            <div class="card-poster">
              <img src="${a.poster}" onerror="this.src='https://placehold.co/300x420/1f232b/fff?text=Anime'" alt="${a.title}">
              <span class="poster-badge">1080p • <span class="pts-badge">${a.pts} PTS</span></span>
            </div>
            <div class="card-title">${a.title}</div>
            <div class="card-meta">★ ${a.rating} • ${a.studio || 'Anime'}</div>
          </div>
        `).join('');

        if (data.results.length > 0) {
          renderAnime(data.results[0]);
        }
      } catch (e) {
        console.error('loadCatalog error:', e);
      }
    }

    function renderAnime(a) {
      currentAnime = a;
      document.getElementById('detail-title').innerText = a.title;
      document.getElementById('detail-subtitle').innerText = a.subtitle || '';
      document.getElementById('detail-poster-img').src = a.poster;
      document.getElementById('poster-pts').innerText = (a.pts || 94) + ' PTS';
      document.getElementById('detail-meta-line').innerHTML = `
        <span class="meta-star">★ ${a.rating}</span>
        <span>•</span>
        <span class="pts-badge" id="meta-pts-badge" style="background: rgba(42, 171, 238, 0.12); padding: 2px 7px; border-radius: 6px; border: 0.5px solid rgba(42, 171, 238, 0.3);">${a.pts || 94} PTS</span>
        <span>•</span>
        <span>${a.year || '2024'}</span>
        <span>•</span>
        <span>${a.episodes || 12} серий</span>
        <span>•</span>
        <span>${a.studio || 'Studio Bind'}</span>
        <span>•</span>
        <span style="color: var(--accent-green); font-weight: 600">${a.status || 'Завершён'}</span>
      `;

      document.getElementById('detail-genres').innerHTML = (a.genres || ['Аниме']).map(g => `
        <span class="genre-tag">${g}</span>
      `).join('');

      const sel = document.getElementById('release-select');
      sel.innerHTML = (a.releases || []).map(r => `
        <option value="${r.id}">${r.title}</option>
      `).join('');

      if (a.releases && a.releases.length > 0) {
        updateVoiceovers(a.releases[0].voiceovers || []);
      }

      const totalEps = a.episodes || 12;
      document.getElementById('episodes-count-text').innerText = totalEps + ' серий';
      const epGrid = document.getElementById('episodes-grid');
      epGrid.innerHTML = Array.from({length: totalEps}, (_, i) => i + 1).map(n => `
        <button class="ep-btn ${n === 1 ? 'active' : ''}" onclick="openPlayer(${n})">
          <span>${n}</span>
          ${n <= 2 ? '<span class="ep-indicator ep-ready" title="Скачано"></span>' : (n === 3 ? '<span class="ep-indicator ep-buffering" title="Буферизация"></span>' : '')}
        </button>
      `).join('');
    }

    function updateVoiceovers(vos) {
      const c = document.getElementById('detail-vos');
      c.innerHTML = vos.map((v, i) => `
        <button class="vo-pill ${i === 0 ? 'active' : ''}" onclick="setVo(this)">${v}</button>
      `).join('');

      const audioSelect = document.getElementById('audio-track-select');
      audioSelect.innerHTML = vos.map(v => `<option>${v}</option>`).join('');
    }

    function onReleaseChange(rId) {
      if (!currentAnime) return;
      const r = (currentAnime.releases || []).find(x => x.id === rId);
      if (r) {
        document.getElementById('poster-pts').innerText = r.pts + ' PTS';
        document.getElementById('meta-pts-badge').innerText = r.pts + ' PTS';
        updateVoiceovers(r.voiceovers || []);
      }
    }

    async function openPlayer(ep) {
      currentEpisode = ep;
      document.getElementById('player-ep-name').innerText = ep + ' серия';
      document.getElementById('player-title').innerText = currentAnime ? currentAnime.title : 'Аниме';
      document.getElementById('btn-watch-text').innerText = 'Смотреть ' + ep + ' серию';
      document.getElementById('video-overlay').classList.add('open');

      try {
        await fetch('/api/play', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({episode: ep, anime_id: currentAnime ? currentAnime.id : '55888'})
        });
      } catch (e) {}
    }

    function closePlayer() {
      document.getElementById('video-overlay').classList.remove('open');
    }

    function playNextEpisode() {
      openPlayer(currentEpisode + 1);
    }

    async function togglePlayPause() {
      try {
        await fetch('/api/player/action', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'toggle_pause'})
        });
      } catch(e) {}
    }

    loadCatalog();
  </script>
</body>
</html>
